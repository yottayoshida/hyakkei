<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      PR-A1.5 containment wiring: same policy as index.html, kept in sync by
      csp-containment.test.ts (see that file's comment for why a <meta> copy
      exists per HTML entry and where the single source of truth lives).
      Also proves the CSP does not regress golden rendering: this harness is
      what e2e/golden-narrow-viewport.spec.ts and the Docker pixel-golden
      suite actually render through.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyakkei golden harness</title>
  </head>
  <body>
    <!--
      PR-C pixel-golden/narrow-viewport harness entry -- a SEPARATE Vite
      build input from index.html (see vite.config.ts), so this page's
      bake()/golden-fixtures imports never reach index.html's real-app
      bundle (/simplify Altitude finding). Never linked from index.html;
      reached only via e2e/pixel-golden and e2e/golden-narrow-viewport.spec.ts.
    -->
    <div id="root"></div>
    <script type="module" src="/src/golden-main.tsx"></script>
  </body>
</html>
