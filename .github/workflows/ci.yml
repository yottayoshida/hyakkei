name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# #71 (audit round 2, refined by Codex round-2 review P1-1): PR pushes
# (force-push amend, or successive commits on the same branch) cancel their
# own in-flight run so CI capacity isn't spent on a superseded diff. `main`
# pushes never cancel or supersede each other -- this repo's squash-merge
# workflow means every `main` push is a distinct, intentional merge commit
# whose CI result we always want to keep.
#
# `cancel-in-progress: false` alone is NOT sufficient for that guarantee: it
# only protects a *currently running* job. GitHub's concurrency queuing also
# keeps at most one *pending* run per group and silently replaces an older
# pending run with a newer one in the same group, regardless of
# `cancel-in-progress` (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
# With a single `ci-${{ github.ref }}` group shared by every `main` push,
# rapid successive pushes could still leave an intermediate merge commit's
# run queued-then-replaced, unverified.
#
# Fix: give every `push` event (main) its own group via `github.sha`, which
# is unique per commit -- so no two `main` runs ever share a group and there
# is nothing for GitHub to replace. `pull_request` events keep sharing a
# group per branch (`github.head_ref`) so that superseded PR commits still
# cancel each other as intended.
# `github.head_ref` is empty on `push` events (that's specifically why the
# original version fell back to `github.ref` for those events) -- so this
# expression only uses `head_ref` when the event actually provides it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Build
        run: pnpm run build

      - name: Upload packages/app/dist (shared with the pixel-golden job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-dist
          path: packages/app/dist
          retention-days: 1

      # #71 (audit round 2): call `pnpm -r run test` directly rather than
      # the root `test` script (`pnpm run build && pnpm -r run test`) --
      # the "Build" step above already ran `pnpm run build` for this same
      # commit, so re-running it inside this step was a third, redundant
      # full build (confirmed empirically: "Typecheck"'s `tsc --build`
      # above is itself a composite-project build that emits `dist/`, not
      # a `--noEmit` check, so before this fix a single CI run built
      # every package three times over -- Typecheck, Build, and again
      # inside the old `pnpm run test`). The root `test` script itself is
      # intentionally left as-is (package.json) for local
      # self-containedness: `pnpm test` from a clean checkout must build
      # first because `packages/app`'s test suite imports
      # `packages/core`'s built `dist/` output, not its `src/`. Do NOT
      # reorder this step to run before "Build" above -- app tests depend
      # on the core dist/ that Build produces.
      - name: Unit tests
        run: pnpm -r run test

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: E2E tests
        run: pnpm run test:e2e

  pixel-golden:
    # PR-C golden layer ③ (plan §技術選定): a separate job, not a step in
    # build-and-test above -- `toHaveScreenshot()` determinism depends on
    # running inside the SAME OS/font environment every time
    # (mcr.microsoft.com/playwright's own image), not GitHub's
    # `ubuntu-latest` host image whose font packages can drift under a
    # runner image bump independently of this repo's own changes.
    #
    # Depends on build-and-test and reuses its `packages/app/dist` artifact
    # (/simplify Efficiency finding) instead of running a second full
    # `pnpm install --frozen-lockfile` + `pnpm run build` from scratch.
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packages/app/dist (built by build-and-test)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-dist
          path: packages/app/dist

      # `test:e2e:pixel-golden` (package.json) is the ONE place the pinned
      # Playwright Docker image tag is derived (/simplify Altitude finding:
      # this job previously re-derived it independently via a different
      # method, `pnpm exec playwright --version | awk`, two ways to compute
      # one value).
      - name: Pixel golden (Docker, deterministic fonts/renderer)
        run: pnpm run test:e2e:pixel-golden

      # /code-review (xhigh) finding: without this, a failed byte-exact
      # pixel comparison produced only a pass/fail log line -- no
      # actual/expected/diff image to inspect, forcing a contributor to
      # reproduce the exact CI environment locally, blind, to triage the
      # one failure mode this whole layer exists to catch. The Docker bind
      # mount (`-v "$(pwd)":/work`, package.json) means Playwright's
      # `test-results/` output (repo-root-relative -- confirmed empirically
      # by forcing a failure locally, NOT `e2e/test-results` despite the
      # config living in `e2e/`) lands on this runner's filesystem too, not
      # just inside the container.
      - name: Upload pixel-golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixel-golden-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
